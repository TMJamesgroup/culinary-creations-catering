<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Culinary Creations | Team Inbox</title><style>body{background:#101a16;color:#f6f2e8;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:22px}h1,h2{font-family:Georgia,serif}a{color:#d5b576}input,textarea,select,button{font:inherit;padding:10px;border-radius:5px}input,textarea{box-sizing:border-box;width:100%}textarea{min-height:90px}button{background:#d5b576;color:#101a16;border:0;cursor:pointer;font-weight:700}section,article{border:1px solid #526a57;background:#1c2822;padding:18px;margin:12px 0;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.muted{color:#b6c0b8}pre{white-space:pre-wrap;overflow-wrap:anywhere}.message{border-bottom:1px solid #526a57;padding:10px 0;white-space:pre-wrap}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="/">← Website</a><h1>Team Inbox & Catering Management</h1><p class="muted">Private staff console. Sign in with your management email and password.</p><section><label>Email<input id="email" type="email" autocomplete="username" placeholder="info@culinarycreationsgroup.com" value="info@culinarycreationsgroup.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password"></label><label style="display:flex;align-items:center;gap:8px;margin:8px 0 14px"><input id="showpassword" type="checkbox" style="width:auto"> Show password</label><label>Authenticator code (when enabled)<input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></label><p><button id="load">Sign in</button> <button id="refresh">Refresh</button></p><p id="status" role="status"></p></section><div id="workspace" class="hidden"><div class="grid"><section><h2>Customer conversations</h2><div id="customers"></div></section><section><h2 id="selected">Select a customer</h2><div id="messages"></div><form id="reply" class="hidden"><textarea id="replybody" maxlength="3000" required placeholder="Reply to customer"></textarea><p><button>Send reply</button></p></form></section></div><section><h2>AI Intake & Follow-up Worklist</h2><p id="workcount" class="muted"></p><div id="worklist"></div></section><section><h2>Event inquiries & partner applications</h2><div id="inquiries"></div></section></div></main><script>const API='https://culinary-creations-api.onrender.com',e=id=>document.getElementById(id);let selected=null,conversations=[],adminSession=sessionStorage.getItem('cc_admin_session')||'';function status(s){e('status').textContent=s}function item(tag,text){const x=document.createElement(tag);x.textContent=text;return x}async function call(path,method='GET',body){const r=await fetch(API+path,{method,headers:{Authorization:'Bearer '+adminSession,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Request failed: '+r.status);return d}async function load(){status('Loading inquiries and conversations...');try{const [inquiries,chat]=await Promise.all([call('/api/admin/inquiries'),call('/api/admin/conversations')]);const work=await call('/api/admin/worklist').catch(()=>({tasks:[],open:0,needs_followup:0}));e('workcount').textContent=work.open+' open requests • '+work.needs_followup+' need follow-up (2+ days)';e('worklist').replaceChildren();for(const t of work.tasks){const a=document.createElement('article');a.append(item('strong','#'+t.id+' • '+t.customer+' • '+t.priority.toUpperCase()),item('p',t.next_step),item('small',t.status+' • '+t.age_days+' days old • '+t.email));e('worklist').append(a)}if(!work.tasks.length)e('worklist').append(item('p','No open requests.'));conversations=chat.messages;e('workspace').classList.remove('hidden');e('customers').replaceChildren();for(const c of chat.customers){const b=item('button',c.name+' ('+c.email+') — '+c.messages+' messages');b.style.cssText='display:block;margin:8px 0;text-align:left;width:100%';b.onclick=()=>select(c);e('customers').append(b)}if(!chat.customers.length)e('customers').append(item('p','No customer accounts yet.'));e('inquiries').replaceChildren();for(const q of inquiries){const a=document.createElement('article');a.append(item('h3','#'+q.id+' • '+q.kind),item('p',new Date(q.created_at).toLocaleString()));const sel=document.createElement('select');for(const v of ['new','reviewing','quoted','confirmed','completed','declined']){const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=q.status===v;sel.append(o)}sel.onchange=async()=>{try{await call('/api/admin/inquiries/'+q.id,'PATCH',{status:sel.value});status('Inquiry #'+q.id+' updated')}catch(err){status(err.message)}};a.append(sel,item('pre',JSON.stringify(q.payload,null,2)));e('inquiries').append(a)}if(!inquiries.length)e('inquiries').append(item('p','No inquiries received yet.'));if(selected){const c=chat.customers.find(x=>x.id===selected.id);if(c)select(c)}status('Inbox loaded • '+inquiries.length+' inquiries • '+chat.customers.length+' customers')}catch(err){if(/401|sign-in required|unauthorized/i.test(err.message)){adminSession='';sessionStorage.removeItem('cc_admin_session')}status(err.message)}}function select(c){selected=c;e('selected').textContent=c.name+' • '+c.email;e('messages').replaceChildren();for(const m of conversations.filter(x=>x.customer_id===c.id))e('messages').append(item('div',(m.sender==='team'?'Team':'Customer')+' • '+new Date(m.created_at).toLocaleString()+'\n'+m.body));if(!e('messages').children.length)e('messages').append(item('p','No messages yet.'));e('reply').classList.remove('hidden')}e('reply').onsubmit=async ev=>{ev.preventDefault();if(!selected)return;try{await call('/api/admin/messages?customer_id='+selected.id,'POST',{body:e('replybody').value});e('replybody').value='';await load();status('Reply saved for '+selected.name)}catch(err){status(err.message)}};e('showpassword').onchange=()=>{e('password').type=e('showpassword').checked?'text':'password'};e('load').onclick=async()=>{status('Signing in...');try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e('email').value,password:e('password').value,otp:e('otp').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Sign-in failed');adminSession=d.token;sessionStorage.setItem('cc_admin_session',adminSession);e('password').value='';await load()}catch(err){status(err.message)}};e('refresh').onclick=load;if(adminSession)load();</script><script>document.querySelectorAll('input[type="password"]').forEach(input=>{const b=document.createElement('button');b.type='button';b.textContent='Show';b.setAttribute('aria-label','Show password');b.style.margin='0 0 12px 8px';b.onclick=()=>{const show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Hide':'Show';b.setAttribute('aria-label',show?'Hide password':'Show password')};input.insertAdjacentElement('afterend',b)});</script></body></html>
