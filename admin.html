<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Culinary Creations | Private Inquiries</title><style>body{background:#121d17;color:#f6f1e5;font:16px system-ui;margin:0}main{max-width:960px;margin:auto;padding:32px 18px}h1{font:40px Georgia,serif}input,button{padding:12px;border-radius:6px;font:inherit}input{width:min(100%,480px);box-sizing:border-box}button{background:#d5b576;border:0;cursor:pointer}article{background:#25342a;border:1px solid #52634f;border-radius:8px;padding:20px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#c8d0c5}</style></head><body><main><h1>Private Catering Inquiries</h1><p>Authorized Culinary Creations staff only. Enter your administrator access token to view saved event and partnership submissions.</p><input id="token" type="password" placeholder="Administrator access token" autocomplete="off"> <button onclick="load()">View inquiries</button><p id="status"></p><div id="results"></div><small>Access token is held only in this page while open; it is not saved to browser storage. Never share your token with customers.</small></main><script>async function load(){const t=document.getElementById('token').value.trim(),status=document.getElementById('status'),results=document.getElementById('results');results.replaceChildren();if(!t){status.textContent='Enter the private administrator token.';return}status.textContent='Loading…';try{const r=await fetch('https://culinary-creations-api.onrender.com/api/admin/inquiries',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw Error(r.status===401?'Access denied. Check your token.':'Unable to load inquiries ('+r.status+').');const list=await r.json();status.textContent=list.length+' most recent inquiries';for(const item of list){const a=document.createElement('article'),h=document.createElement('h2'),meta=document.createElement('small'),p=document.createElement('pre');h.textContent='#'+item.id+' — '+(item.kind==='partner'?'Partnership application':'Event inquiry');meta.textContent=new Date(item.created_at).toLocaleString()+' • '+item.status;p.textContent=Object.entries(item.payload).map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v,null,2):v)).join('\n');a.append(h,meta,p);results.append(a)}}catch(e){status.textContent=e.message}}</script></body></html>
