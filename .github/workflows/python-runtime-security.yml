name: Python runtime security regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python -c "import sys; assert sys.version_info[:3] == (3, 12, 16)"
      - run: python -m pip install -r backend/requirements.txt httpx
      - run: python -m pip check
      - run: python security_upgrade_smoke.py
