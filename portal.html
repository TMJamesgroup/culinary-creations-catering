<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Portal | Culinary Creations Catering</title><style>body{background:#101a16;color:#f6f2e8;font:16px system-ui;margin:0}header,main{max-width:920px;margin:auto;padding:24px}a{color:#d5b576}h1,h2{font-family:Georgia,serif}section{background:#1c2822;border:1px solid #526a57;border-radius:10px;padding:22px;margin:20px 0}input,textarea,button{font:inherit;padding:12px;border-radius:6px;box-sizing:border-box}input,textarea{width:100%;margin:6px 0 12px;border:1px solid #829187}button{background:#d5b576;border:0;color:#101a16;font-weight:700;cursor:pointer}textarea{min-height:100px}.hidden{display:none}.msg{border-bottom:1px solid #526a57;padding:12px 0;white-space:pre-wrap}.muted{color:#b6c0b8}.error{color:#ffb3a6}</style></head><body><header><a href="/">← Culinary Creations Catering</a><h1>Customer Portal</h1><p>View your catering requests and communicate directly with our team.</p></header><main><section id="auth"><h2 id="heading">Sign in</h2><form id="authform"><label id="namelabel" class="hidden">Your name<input id="name" autocomplete="name"></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="12" required></label><label style="display:flex;align-items:center;gap:8px;margin:8px 0 14px"><input id="showpassword" type="checkbox" style="width:auto"> Show password</label><button id="submit">Sign in</button></form><p><button type="button" id="switch">Create an account</button></p><p id="authstatus" role="status"></p></section><section id="account" class="hidden"><p>Signed in as <strong id="who"></strong> <button id="logout">Sign out</button></p><h2>My catering requests</h2><div id="requests" class="muted">Loading...</div><p><a href="/#proposal">Start a new event proposal</a></p><h2>Messages with our team</h2><div id="messages"></div><form id="messageform"><label>Send a message<textarea id="body" maxlength="3000" required placeholder="Ask about your catering request, event details or changes"></textarea></label><button>Send message</button></form><p id="msgstatus" role="status"></p><button id="refresh">Refresh messages</button></section></main><script>const API='https://culinary-creations-api.onrender.com';let token=sessionStorage.getItem('cc_token')||'';let register=false;const el=id=>document.getElementById(id);function status(id,s){el(id).textContent=s}async function call(path,options={}){const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Request failed ('+r.status+')');return d}function view(){el('auth').classList.toggle('hidden',!!token);el('account').classList.toggle('hidden',!token);if(token)load()}el('showpassword').onchange=()=>{el('password').type=el('showpassword').checked?'text':'password'};el('switch').onclick=()=>{register=!register;el('heading').textContent=register?'Create an account':'Sign in';el('submit').textContent=register?'Register':'Sign in';el('switch').textContent=register?'Already registered? Sign in':'Create an account';el('namelabel').classList.toggle('hidden',!register);status('authstatus','')};el('authform').onsubmit=async e=>{e.preventDefault();status('authstatus','Connecting...');try{const d=await call(register?'/api/customer/register':'/api/customer/login',{method:'POST',body:JSON.stringify({name:el('name').value,email:el('email').value,password:el('password').value})});token=d.token;sessionStorage.setItem('cc_token',token);el('who').textContent=d.name||el('email').value;view()}catch(err){status('authstatus',err.message)}};el('logout').onclick=()=>{token='';sessionStorage.removeItem('cc_token');view()};function node(tag,txt,cls){const x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x}async function load(){try{const d=await call('/api/customer/dashboard');el('requests').replaceChildren(...(d.inquiries.length?d.inquiries.map(q=>node('p','#'+q.id+' • '+q.kind+' • '+q.status+' • '+new Date(q.created_at).toLocaleDateString())):[node('p','No requests linked to this account yet. New proposals submitted while signed in can be linked to your account.')]));el('messages').replaceChildren(...(d.messages.length?d.messages.map(m=>node('div',(m.sender==='team'?'Culinary Creations Team':'You')+' • '+new Date(m.created_at).toLocaleString()+'\n'+m.body,'msg')):[node('p','No messages yet. Send your first message below.','muted')]))}catch(err){status('msgstatus',err.message);if(/401|session|Unauthorized/i.test(err.message)){token='';sessionStorage.removeItem('cc_token');view()}}}el('refresh').onclick=load;el('messageform').onsubmit=async e=>{e.preventDefault();status('msgstatus','Sending...');try{await call('/api/customer/messages',{method:'POST',body:JSON.stringify({body:el('body').value})});el('body').value='';status('msgstatus','Message sent to the team.');await load()}catch(err){status('msgstatus',err.message)}};view();</script><script>document.querySelectorAll('input[type="password"]').forEach(input=>{const b=document.createElement('button');b.type='button';b.textContent='Show';b.setAttribute('aria-label','Show password');b.style.margin='0 0 12px 8px';b.onclick=()=>{const show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Hide':'Show';b.setAttribute('aria-label',show?'Hide password':'Show password')};input.insertAdjacentElement('afterend',b)});</script></body></html>
